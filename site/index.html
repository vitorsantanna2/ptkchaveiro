<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PTK Chaveiro - Mini Site</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <div class="avatar">
        <img id="hero-image" src="assets/ptk-chaveiro.jpg" alt="Imagem PTK Chaveiro" />
      </div>

      <section class="info">
        <h1>PTK Chaveiro</h1>
        <p class="tagline">Soluções rápidas em chaves e travas — atendimento 24h</p>

        <div class="contacts">
          <a id="call-btn" class="contact-btn" href="#">Ligar</a>
          <a id="whatsapp-btn" class="contact-btn" href="#">WhatsApp</a>
        </div>
      </section>

      <footer class="meta">
        <small>Imagem usada para demonstração — substitua `assets/ptk-chaveiro.jpg` pelo arquivo real.</small>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
